name: Build Indestructible compatibility tools
on:
  push:
    branches: [indestructible-temp-fetch]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download published GameBridge APK
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o GameBridge-0.2.apk https://github.com/braxten509/arm32-bridge/releases/download/v0.2/GameBridge-0.2.apk
          echo "47a6f3ab79a7adb9b0838181edf87c20c8949ce48a7bb38ea91f9e419a116961  GameBridge-0.2.apk" | sha256sum -c -
      - name: Install NDK 30 for converter build
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          test -x "$SDKMANAGER"
          mkdir -p "$HOME/Android/Sdk"
          yes | "$SDKMANAGER" --sdk_root="$HOME/Android/Sdk" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$HOME/Android/Sdk" "ndk;30.0.16248370"
      - name: Build host converter
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/braxten509/arm32-bridge.git
          cd arm32-bridge
          export NDK="$HOME/Android/Sdk/ndk/30.0.16248370"
          cargo build --release -p apk-convert
          cp target/release/apk-convert ../apk-convert-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: indestructible-tools
          path: |
            GameBridge-0.2.apk
            apk-convert-linux-x86_64
          if-no-files-found: error
